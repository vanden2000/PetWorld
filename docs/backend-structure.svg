  <rect class="node folder" x="340" y="605" width="150" height="52" rx="8"/><text class="text" x="358" y="637">Resources/</text>
  <rect class="node folder" x="20" y="680" width="150" height="52" rx="8"/><text class="text" x="38" y="712">Admin/</text>
  <rect class="node folder" x="180" y="680" width="150" height="52" rx="8"/><text class="text" x="198" y="712">Api/</text>
  <text class="small" x="20" y="765">Admin: dashboard, catalog, orders, reports</text>
  <text class="small" x="20" y="790">API: auth, products, checkout, chat, webhooks</text>

  <rect class="node file" x="365" y="605" width="300" height="61" rx="8"/>
  <text class="head" x="385" y="634">Services nghiệp vụ</text>
  <text class="small" x="385" y="656">SePay • GHN • GHTK • Chatbot • Shipping</text>
