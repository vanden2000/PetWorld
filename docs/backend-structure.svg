<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
  <title id="title">Cấu trúc thư mục Back-end PetWorld</title>
  <desc id="desc">Sơ đồ thư mục backend Laravel cho hệ thống PetWorld.</desc>
  <style>
    .bg{fill:#f8fafc}.title{font:700 34px Arial,sans-serif;fill:#7c2d12}.sub{font:400 18px Arial,sans-serif;fill:#475569}.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.root{fill:#9a3412;stroke:#9a3412}.group{fill:#ffedd5;stroke:#fb923c}.folder{fill:#fff7ed;stroke:#fdba74}.file{fill:#ffffff;stroke:#d1d5db}.head{font:700 19px Arial,sans-serif;fill:#0f172a}.roottext{font:700 21px Arial,sans-serif;fill:#fff}.text{font:400 16px Arial,sans-serif;fill:#334155}.small{font:400 14px Arial,sans-serif;fill:#64748b}.line{stroke:#94a3b8;stroke-width:2;fill:none}
  </style>
  <rect class="bg" width="1600" height="1130"/>
  <text class="title" x="65" y="65">CẤU TRÚC THƯ MỤC DỰ ÁN BACK-END PETWORLD</text>
  <text class="sub" x="65" y="100">Laravel 10 • REST API • Laravel Blade Admin • MySQL</text>

  <rect class="node root" x="650" y="135" width="300" height="58" rx="10"/>
  <text class="roottext" x="690" y="172">backend/</text>
  <path class="line" d="M800 193V230M135 230H1475M135 230V265M390 230V265M655 230V265M935 230V265M1215 230V265M1475 230V265"/>

  <rect class="node group" x="55" y="265" width="165" height="58" rx="8"/><text class="head" x="80" y="300">app/</text><text class="small" x="80" y="348">Nghiệp vụ lõi</text>
  <rect class="node group" x="300" y="265" width="175" height="58" rx="8"/><text class="head" x="325" y="300">config/</text><text class="small" x="325" y="348">Cấu hình dịch vụ</text>
  <rect class="node group" x="555" y="265" width="200" height="58" rx="8"/><text class="head" x="580" y="300">database/</text><text class="small" x="580" y="348">Schema và seed data</text>
  <rect class="node group" x="835" y="265" width="200" height="58" rx="8"/><text class="head" x="860" y="300">resources/</text><text class="small" x="860" y="348">Blade views, mail</text>
  <rect class="node group" x="1115" y="265" width="200" height="58" rx="8"/><text class="head" x="1140" y="300">routes/</text><text class="small" x="1140" y="348">Web và API routes</text>
  <rect class="node folder" x="1395" y="265" width="160" height="58" rx="8"/><text class="head" x="1420" y="300">storage/</text><text class="small" x="1420" y="348">Logs, files</text>

  <path class="line" d="M137 323V385M35 385H715M35 385V420M205 385V420M375 385V420M545 385V420M715 385V420"/>
  <rect class="node folder" x="25" y="420" width="150" height="52" rx="8"/><text class="text" x="43" y="452">Http/</text>
  <rect class="node folder" x="195" y="420" width="150" height="52" rx="8"/><text class="text" x="213" y="452">Models/</text>
  <rect class="node folder" x="365" y="420" width="150" height="52" rx="8"/><text class="text" x="383" y="452">Services/</text>
