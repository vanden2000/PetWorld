  <rect class="node folder" x="25" y="495" width="150" height="52" rx="8"/><text class="text" x="43" y="527">Observers/</text>
  <rect class="node folder" x="195" y="495" width="150" height="52" rx="8"/><text class="text" x="213" y="527">Notifications/</text>
  <rect class="node folder" x="365" y="495" width="150" height="52" rx="8"/><text class="text" x="383" y="527">Providers/</text>
  <rect class="node folder" x="535" y="495" width="150" height="52" rx="8"/><text class="text" x="553" y="527">Exports/</text>
  <rect class="node folder" x="705" y="495" width="150" height="52" rx="8"/><text class="text" x="723" y="527">Queries/ Support/</text>

