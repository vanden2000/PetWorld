  <rect class="node folder" x="540" y="420" width="135" height="52" rx="8"/><text class="text" x="558" y="452">migrations/</text>
  <rect class="node folder" x="690" y="420" width="135" height="52" rx="8"/><text class="text" x="708" y="452">seeders/</text>
  <rect class="node file" x="540" y="495" width="285" height="61" rx="8"/>
  <text class="head" x="560" y="524">Migrations</text><text class="small" x="560" y="546">Tạo bảng và quan hệ MySQL</text>
  <rect class="node file" x="540" y="575" width="285" height="61" rx="8"/>
  <text class="head" x="560" y="604">Seeders</text><text class="small" x="560" y="626">Dữ liệu mẫu, sản phẩm, voucher</text>

  <path class="line" d="M935 323V385M835 385H1035M835 385V420M1035 385V420"/>
  <rect class="node folder" x="825" y="420" width="195" height="52" rx="8"/><text class="text" x="843" y="452">views/Admin/</text>
  <rect class="node folder" x="825" y="495" width="195" height="52" rx="8"/><text class="text" x="843" y="527">views/emails/</text>
  <text class="small" x="825" y="580">Giao diện Blade quản trị</text>
  <text class="small" x="825" y="605">Template email đơn hàng, OTP</text>

  <path class="line" d="M1215 323V385M1115 385H1315M1115 385V420M1215 385V420M1315 385V420"/>
  <rect class="node file" x="1100" y="420" width="135" height="52" rx="8"/><text class="text" x="1118" y="452">api.php</text>
  <rect class="node file" x="1250" y="420" width="135" height="52" rx="8"/><text class="text" x="1268" y="452">web.php</text>
  <rect class="node file" x="1400" y="420" width="135" height="52" rx="8"/><text class="text" x="1418" y="452">console.php</text>
  <text class="small" x="1100" y="500">REST API cho Next.js</text>
  <text class="small" x="1250" y="525">Admin Blade và login</text>

  <rect class="node file" x="1395" y="585" width="160" height="58" rx="8"/><text class="text" x="1413" y="617">logs/</text>
  <rect class="node file" x="1395" y="663" width="160" height="58" rx="8"/><text class="text" x="1413" y="695">app/public/</text>
  <text class="small" x="1395" y="750">Log hệ thống và ảnh upload</text>

  <rect x="65" y="960" width="1470" height="95" rx="12" fill="#ffedd5" stroke="#fdba74"/>
  <text class="head" x="95" y="995">Nguyên tắc tổ chức</text>
  <text class="text" x="95" y="1025">Controllers nhận request • Services chứa nghiệp vụ/tích hợp • Models thao tác dữ liệu • Routes định tuyến • Migrations quản lý cấu trúc CSDL.</text>
</svg>
